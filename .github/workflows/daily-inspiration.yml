name: Daily Inspiration Dispatch

on:
  schedule:
    # Runs daily at 08:00 AM UTC (adjust as desired)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual test trigger via GitHub UI'

jobs:
  trigger-daily-emails:
    name: Trigger Daily Inspiration Job
    runs-on: ubuntu-latest
    steps:
      - name: Send Trigger Request to FastAPI Server
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Use configured APP_URL or default fallback
          TARGET_URL="${APP_URL:-https://daily-inspiration-app.onrender.com}"
          ENDPOINT="${TARGET_URL%/}/api/jobs/send-daily-inspiration"
          
          echo "Triggering daily inspiration job at $ENDPOINT..."
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "$ENDPOINT" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --max-time 180)
          
          BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | sed -e 's/HTTP_STATUS://')
          
          echo "Response Status: $HTTP_STATUS"
          echo "Response Body: $BODY"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Daily inspiration job completed successfully."
          else
            echo "Daily inspiration trigger failed with HTTP status $HTTP_STATUS."
            exit 1
          fi
